<svg viewBox="0 0 880 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ManaBar in the macOS menu bar: bars icon plus binding-provider letter and percent" font-family="-apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="880" height="96" rx="16" fill="#0b0b0e"/>

  <!-- menu bar strip -->
  <rect x="24" y="28" width="832" height="40" rx="10" fill="#1b1b20" stroke="rgba(255,255,255,0.08)"/>

  <!-- left: app menus -->
  <g font-size="13.5" fill="#ececf0">
    <circle cx="52" cy="48" r="7" fill="#94969f" opacity="0.85"/>
    <text x="74" y="53" font-weight="700">Finder</text>
    <text x="134" y="53" opacity="0.75">File</text>
    <text x="172" y="53" opacity="0.75">Edit</text>
    <text x="212" y="53" opacity="0.75">View</text>
    <text x="258" y="53" opacity="0.75">Window</text>
  </g>

  <!-- right: status items -->
  <g>
    <!-- ManaBar: four bars + binding-provider text "G 18%" -->
    <g>
      <rect x="580" y="38" width="4" height="16" rx="2" fill="#97c459"/>
      <rect x="587" y="36" width="4" height="18" rx="2" fill="#97c459"/>
      <rect x="594" y="46" width="4" height="8"  rx="2" fill="#ef9f27"/>
      <rect x="601" y="50" width="4" height="4"  rx="2" fill="#e24b4a"/>
      <text x="614" y="53" font-size="13.5" font-weight="600" fill="#ececf0">G 18%</text>
    </g>

    <!-- control center -->
    <g stroke="#b9bbc2" stroke-width="1.8" fill="none">
      <rect x="684" y="40" width="18" height="6" rx="3"/>
      <rect x="684" y="50" width="18" height="6" rx="3"/>
      <circle cx="689" cy="43" r="1.6" fill="#b9bbc2" stroke="none"/>
      <circle cx="697" cy="53" r="1.6" fill="#b9bbc2" stroke="none"/>
    </g>
    <!-- wifi -->
    <g stroke="#b9bbc2" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M 726 48 a 11 11 0 0 1 18 0" opacity="0.5"/>
      <path d="M 730 52 a 6 6 0 0 1 10 0" opacity="0.8"/>
      <circle cx="735" cy="55" r="1.5" fill="#b9bbc2" stroke="none"/>
    </g>
    <!-- battery -->
    <g>
      <rect x="760" y="41" width="22" height="12" rx="3" fill="none" stroke="#b9bbc2" stroke-width="1.6"/>
      <rect x="762" y="43" width="14" height="8" rx="1.5" fill="#b9bbc2"/>
      <rect x="783" y="44.5" width="2.5" height="5" rx="1" fill="#b9bbc2"/>
    </g>
    <!-- clock -->
    <text x="800" y="53" font-size="13" fill="#ececf0">9:47 PM</text>
  </g>
</svg>
