    <circle cx="104" cy="451" r="3.5" fill="#8b7cf0"/>
    <text x="114" y="456" font-size="14.5" font-weight="600" fill="#ececf0">Grok</text>
    <rect x="156" y="443" width="58" height="17" rx="8.5" fill="none" stroke="rgba(255,255,255,0.15)"/>
    <text x="185" y="455" font-size="9.5" font-weight="600" letter-spacing="0.5" fill="#94969f" text-anchor="middle">CREDITS</text>
    <text x="100" y="478" font-size="11.5" fill="#94969f">Credits &#183; 18% left</text>
    <text x="100" y="494" font-size="11.5" fill="#ef9f27">&#8776; exhausted in 2d 4h</text>
    <line x1="30" y1="522" x2="350" y2="522" stroke="rgba(255,255,255,0.07)"/>
    <text x="30" y="540" font-size="11" fill="#94969f">Today 840K ctx &#183; $0.92 est.</text>
    <g fill="#8b7cf0">
      <rect x="47.5"  y="578" width="9" height="12" rx="4.5" opacity="0.45"/>
      <rect x="93.5"  y="574" width="9" height="16" rx="4.5" opacity="0.45"/>
      <rect x="139.5" y="568" width="9" height="22" rx="4.5" opacity="0.45"/>
      <rect x="185.5" y="572" width="9" height="18" rx="4.5" opacity="0.45"/>
      <rect x="231.5" y="564" width="9" height="26" rx="4.5" opacity="0.45"/>
      <rect x="277.5" y="560" width="9" height="30" rx="4.5" opacity="0.45"/>
      <rect x="323.5" y="570" width="9" height="20" rx="4.5"/>
    </g>
    <text x="328" y="562" font-size="9" font-weight="600" fill="#94969f" text-anchor="middle">840K</text>
    <g font-size="9" fill="#66686f" text-anchor="middle">
      <text x="52" y="604">T</text><text x="98" y="604">W</text><text x="144" y="604">T</text>
      <text x="190" y="604">F</text><text x="236" y="604">S</text><text x="282" y="604">S</text>
      <text x="328" y="604" fill="#94969f" font-weight="600">M</text>
    </g>
  </g>

  <!-- ============================= DeepSeek ============================= -->
  <g>
    <rect x="14" y="632" width="352" height="196" rx="12" fill="#101014" stroke="rgba(255,255,255,0.07)"/>
    <!-- ring: 6% red -->
    <circle cx="58" cy="674" r="25.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
    <circle cx="58" cy="674" r="25.5" fill="none" stroke="#e24b4a" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="9.6 160.2" transform="rotate(-90 58 674)"/>
    <text x="58" y="680" font-size="17" font-weight="600" fill="#ececf0" text-anchor="middle">6</text>
    <circle cx="104" cy="657" r="3.5" fill="#3aa981"/>
    <text x="114" y="662" font-size="14.5" font-weight="600" fill="#ececf0">DeepSeek</text>
    <rect x="196" y="649" width="34" height="17" rx="8.5" fill="none" stroke="rgba(255,255,255,0.15)"/>
    <text x="213" y="661" font-size="9.5" font-weight="600" letter-spacing="0.5" fill="#94969f" text-anchor="middle">API</text>
    <text x="100" y="684" font-size="11.5" fill="#94969f">Balance &#183; &#165;6.20 of &#165;100.00 &#183; 6% left</text>
    <text x="100" y="700" font-size="11.5" fill="#e24b4a">&#8776; exhausted in 5d 2h</text>
    <line x1="30" y1="728" x2="350" y2="728" stroke="rgba(255,255,255,0.07)"/>
    <text x="30" y="746" font-size="11" fill="#94969f">Today 1.2M in &#183; 4.1K out &#183; &#165;0.86 est.</text>
    <g fill="#3aa981">
      <rect x="47.5"  y="788" width="9" height="8"  rx="4"   opacity="0.45"/>
      <rect x="93.5"  y="786" width="9" height="10" rx="4.5" opacity="0.45"/>
      <rect x="139.5" y="782" width="9" height="14" rx="4.5" opacity="0.45"/>
      <rect x="185.5" y="784" width="9" height="12" rx="4.5" opacity="0.45"/>
      <rect x="231.5" y="778" width="9" height="18" rx="4.5" opacity="0.45"/>
      <rect x="277.5" y="774" width="9" height="22" rx="4.5" opacity="0.45"/>
      <rect x="323.5" y="780" width="9" height="16" rx="4.5"/>
    </g>
    <text x="328" y="772" font-size="9" font-weight="600" fill="#94969f" text-anchor="middle">1.2M</text>
    <g font-size="9" fill="#66686f" text-anchor="middle">
      <text x="52" y="814">T</text><text x="98" y="814">W</text><text x="144" y="814">T</text>
      <text x="190" y="814">F</text><text x="236" y="814">S</text><text x="282" y="814">S</text>
      <text x="328" y="814" fill="#94969f" font-weight="600">M</text>
    </g>
  </g>

  <!-- footer -->
  <text x="190" y="850" font-size="10" fill="#66686f" text-anchor="middle" opacity="0.85">&#8635; updated 12s ago</text>
</svg>
